<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>You are offline · Agent Academy</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #faf9f7; color: #26231e;
      }
      @media (prefers-color-scheme: dark) { body { background: #141311; color: #ece8e0; } }
      .card {
        max-width: 28rem; margin: 1.5rem; padding: 2.25rem; border: 1px solid #e7e3db;
        border-radius: 12px; background: #ffffff;
      }
      @media (prefers-color-scheme: dark) { .card { background: #1c1a17; border-color: #2e2b26; } }
      .dot { display: inline-block; width: 10px; height: 10px; border-radius: 9999px; background: #c2410c; box-shadow: 0 0 0 4px rgba(194,65,12,0.15); margin-right: 8px; }
      h1 { font-size: 1.375rem; margin: 0 0 0.75rem; font-weight: 600; letter-spacing: -0.01em; }
      p { font-size: 0.9375rem; line-height: 1.6; color: #57534a; margin: 0 0 0.75rem; }
      @media (prefers-color-scheme: dark) { p { color: #b5afa4; } }
      a.btn {
        display: inline-block; margin-top: 0.5rem; padding: 0.55rem 1.1rem; border-radius: 10px;
        background: #c2410c; color: #fff; text-decoration: none; font-size: 0.875rem; font-weight: 600;
      }
      ul { font-size: 0.875rem; line-height: 1.7; color: #57534a; padding-left: 1.25rem; margin: 0.5rem 0 0; }
      @media (prefers-color-scheme: dark) { ul { color: #b5afa4; } }
    </style>
  </head>
  <body>
    <main class="card">
      <h1><span class="dot"></span>You are offline</h1>
      <p>Pages you have already visited — including lessons — still work offline, and your progress keeps saving on this device.</p>
      <ul>
        <li>Works offline: lessons, roadmaps, review cards, planner, journal</li>
        <li>Needs a connection: AI critique/ask features and the live playground</li>
      </ul>
      <p><a class="btn" href="/dashboard">Try again</a></p>
    </main>
  </body>
</html>
