<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="apple-mobile-web-app-title" content="Agent Academy" />
    <meta
      name="description"
      content="Agent Academy — a structured, project-driven path from React developer to production AI Agent Engineer."
    />
    <title>Agent Academy — Become an AI Agent Engineer</title>
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Agent Academy" />
    <meta property="og:title" content="Agent Academy — Become an AI Agent Engineer" />
    <meta
      property="og:description"
      content="A structured, project-driven path from React developer to production AI Agent Engineer."
    />
    <meta name="twitter:card" content="summary" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#faf9f7" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#141311" />
    <script>
      try {
        var t = localStorage.getItem('aa-theme')
        if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches))
          document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
